<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Range resource browser</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 1.5rem; color: #222; }
  h1 { font-size: 1.15rem; }
  fieldset { margin: 0 0 .75rem; padding: .5rem .75rem; border: 1px solid #ccc; border-radius: 6px; }
  legend { font-weight: 600; }
  label { margin-right: .75rem; }
  input[type=number] { width: 6rem; }
  #meta { font-weight: 600; margin: .5rem 0; }
  #status { color: #8a5a00; margin: .25rem 0; }
  .track { border-left: 4px solid #888; padding: .25rem .6rem; margin: .5rem 0; background: #fafafa; }
  .track.anchor { border-color: #1a7f37; }
  .track.foreign { border-color: #b35900; background: #fff7ec; }
  .run { font-family: ui-monospace, monospace; white-space: pre-wrap; margin: .1rem 0; }
  .run.gap { color: #999; }
  .marker { font-family: ui-monospace, monospace; margin: .15rem 0; padding: .15rem .4rem; border-radius: 4px; }
  .marker.conflict { background: #fff0c2; color: #7a5200; }
  .marker.tombstone { background: #fde2e1; color: #8a1f1a; }
  .marker.integrity { background: #fde2e1; color: #8a1f1a; }
  .marker.error { background: #eee; color: #555; }
  #preview { font-family: ui-monospace, monospace; white-space: pre-wrap; background: #f4f4f4;
             padding: .5rem; border-radius: 6px; max-height: 16rem; overflow: auto; }
  #history { font-family: ui-monospace, monospace; font-size: 11px; color: #666; max-height: 9rem; overflow: auto; }
  #history .hist.version-conflict, #history .hist.not-found, #history .hist.integrity-mismatch { color: #8a1f1a; }
  #history .hist.fragment { color: #1a7f37; }
  #history .hist.ignored-stale, #history .hist.cancelled { color: #999; }
  button { margin-right: .35rem; }
</style>
</head>
<body>
<h1>Range resource browser — checkpointed byte-range review</h1>

<fieldset>
  <legend>Resource &amp; selection (byte offsets, end exclusive)</legend>
  <label>id <input id="resource-id" value="sample"></label>
  <label>start <input id="start" name="start" type="number" value="400" min="0"></label>
  <label>end <input id="end" name="end" type="number" value="460" min="0"></label>
  <label>adjacent chunk <input id="chunk" type="number" value="60" min="1"></label>
  <div style="margin-top:.4rem">
    <button id="open">Open range</button>
    <button id="read-before">Read before</button>
    <button id="read-after">Read after</button>
    <button id="refetch">Re-select at latest</button>
    <button id="adopt-version">Adopt new version</button>
    <button id="retry">Retry failed</button>
    <button id="cancel">Cancel pending</button>
  </div>
</fieldset>

<fieldset>
  <legend>Server-side mutation (drive version-moved / deleted scenarios)</legend>
  <label>new size <input id="new-size" type="number" value="5000" min="1"></label>
  <button id="update">PUT updated content</button>
  <button id="delete">DELETE resource</button>
</fieldset>

<div id="meta"></div>
<div id="status"></div>

<h2>Tracks</h2>
<div id="tracks"></div>

<h2>Markers (conflicts · gaps · tombstones · failures)</h2>
<div id="markers"></div>

<h2>Stitched preview</h2>
<pre id="preview"></pre>

<h2>Request history (sequence / pinning / outcome)</h2>
<div id="history"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
